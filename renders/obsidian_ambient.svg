<?xml version="1.0" encoding="utf-8"?>
<!--
  OBSIDIAN Watch Face — Ambient Mode Render
  Shows: dimmed hour/minute hands (no second hand, no seconds),
         no battery/complications, date at reduced alpha.
  All shown on Gold theme for reference.
-->
<svg width="720" height="400"
     viewBox="0 0 720 400"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <rect width="720" height="400" fill="#080808"/>

  <!-- Section title -->
  <text x="360" y="36" text-anchor="middle"
        font-size="13" letter-spacing="4" fill="#444444">AMBIENT MODE</text>
  <text x="360" y="54" text-anchor="middle"
        font-size="9" letter-spacing="2" fill="#2A2A2A">
    ALWAYS-ON · LOW POWER · NO SECOND HAND
  </text>

  <!-- thin rule -->
  <line x1="220" y1="62" x2="500" y2="62" stroke="#1A1A1A" stroke-width="0.5"/>

  <!-- ── Ambient watch face (center, large) ────────────── -->
  <g transform="translate(220, 75)">
    <!-- Scale factor: 280/450 = 0.622 → center at 140,140 -->
    <circle cx="140" cy="140" r="140" fill="#000000"/>
    <!-- Outer ring at 30% opacity (dims in ambient) -->
    <circle cx="140" cy="140" r="138" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.30"/>

    <!-- Hour markers at r=126 (204 × 0.622) — very dim in ambient -->
    <!-- Cardinals (12,3,6,9): r=5, opacity=0.4  Others: r=3.5, opacity=0.25 -->
    <circle cx="140" cy="14"  r="5"   fill="#D4AF37" opacity="0.40"/><!-- 12 -->
    <circle cx="203" cy="32"  r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 1 -->
    <circle cx="249" cy="77"  r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 2 -->
    <circle cx="266" cy="140" r="5"   fill="#D4AF37" opacity="0.40"/><!-- 3 -->
    <circle cx="249" cy="203" r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 4 -->
    <circle cx="203" cy="249" r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 5 -->
    <circle cx="140" cy="266" r="5"   fill="#D4AF37" opacity="0.40"/><!-- 6 -->
    <circle cx="77"  cy="249" r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 7 -->
    <circle cx="31"  cy="203" r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 8 -->
    <circle cx="14"  cy="140" r="5"   fill="#D4AF37" opacity="0.40"/><!-- 9 -->
    <circle cx="31"  cy="77"  r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 10 -->
    <circle cx="77"  cy="32"  r="3.5" fill="#D4AF37" opacity="0.25"/><!-- 11 -->

    <!-- Date — dim, still visible for reference (opacity=0.4) -->
    <text x="140" y="95" text-anchor="middle" font-size="11" fill="#D4AF37" opacity="0.40" letter-spacing="1">WED 15</text>

    <!-- NO battery, NO complications in ambient -->

    <!-- Hour hand (305°) at 70% opacity — no shadow -->
    <!-- tip: (140 + 95×sin(305°), 140 - 95×cos(305°)) -->
    <!-- sin305=-0.819  cos305=0.574 -->
    <!-- tip: (140-77.8, 140-54.5) = (62, 86) -->
    <!-- tail: (140+13×0.819, 140+13×0.574) = (151, 147) -->
    <line x1="151" y1="147" x2="62" y2="86"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.70"/>

    <!-- Minute hand (60°) at 70% opacity -->
    <!-- tip: (140 + 133×0.866, 140 - 133×0.5) = (255, 73.5) -->
    <!-- tail: (140-7×0.866, 140+7×0.5) = (134, 144) -->
    <line x1="134" y1="144" x2="255" y2="74"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.70"/>

    <!-- NO second hand in ambient -->

    <!-- Center jewel -->
    <circle cx="140" cy="140" r="10" fill="#000000"/>
    <circle cx="140" cy="140" r="7"  fill="#D4AF37" opacity="0.35"/>
    <circle cx="140" cy="140" r="3.5" fill="#000000"/>
  </g>

  <!-- ── Callout annotations ──────────────────────────── -->

  <!-- Arrow to outer ring -->
  <line x1="565" y1="105" x2="500" y2="128" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="565" cy="105" r="2" fill="#333333"/>
  <text x="568" y="100" font-size="9" fill="#444444">Ring at 30% opacity</text>

  <!-- Arrow to hour marker -->
  <line x1="560" y1="145" x2="500" y2="160" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="560" cy="145" r="2" fill="#333333"/>
  <text x="563" y="140" font-size="9" fill="#444444">Markers at 40% opacity</text>

  <!-- Arrow to hour hand -->
  <line x1="555" y1="190" x2="445" y2="200" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="555" cy="190" r="2" fill="#333333"/>
  <text x="558" y="185" font-size="9" fill="#444444">Hands at 70% opacity</text>

  <!-- Arrow to date -->
  <line x1="555" y1="230" x2="460" y2="168" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="555" cy="230" r="2" fill="#333333"/>
  <text x="558" y="225" font-size="9" fill="#444444">Date dim (40%)</text>

  <!-- Hidden elements callout -->
  <text x="140" y="260" font-size="9" fill="#333333" text-anchor="middle">Hidden in ambient:</text>
  <text x="140" y="274" font-size="9" fill="#2A2A2A" text-anchor="middle">Second hand · Battery % · Inner ring · Complications</text>

  <!-- Left panel: legend -->
  <text x="120" y="348" text-anchor="middle" font-size="10" fill="#444444" letter-spacing="1">ACTIVE MODE</text>
  <text x="120" y="362" text-anchor="middle" font-size="9" fill="#2A2A2A">Full color · Sweep second</text>
  <text x="120" y="374" text-anchor="middle" font-size="9" fill="#2A2A2A">All complications visible</text>

  <line x1="185" y1="344" x2="185" y2="380" stroke="#1A1A1A" stroke-width="1"/>

  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#444444" letter-spacing="1">AMBIENT MODE</text>
  <text x="360" y="362" text-anchor="middle" font-size="9" fill="#2A2A2A">Monochrome · No second hand</text>
  <text x="360" y="374" text-anchor="middle" font-size="9" fill="#2A2A2A">Minimal draw · Max battery life</text>

  <line x1="535" y1="344" x2="535" y2="380" stroke="#1A1A1A" stroke-width="1"/>

  <text x="628" y="348" text-anchor="middle" font-size="10" fill="#444444" letter-spacing="1">ALWAYS-ON</text>
  <text x="628" y="362" text-anchor="middle" font-size="9" fill="#2A2A2A">Platform-managed</text>
  <text x="628" y="374" text-anchor="middle" font-size="9" fill="#2A2A2A">auto switch on wrist down</text>

  <!-- bottom rule -->
  <line x1="40" y1="388" x2="680" y2="388" stroke="#111111" stroke-width="0.5"/>

</svg>
